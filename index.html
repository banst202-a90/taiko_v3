<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>和太鼓練習Webアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@700;900&display=swap');

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0d0202;
    }
    .font-japanese {
      font-family: 'Yuji Syuku', serif;
    }

    .bg-festival {
      background-color: #1a0505;
      background-image: radial-gradient(circle at 50% 50%, #380a0a 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .drum-pad:active {
      background-color: rgba(245, 158, 11, 0.15);
      box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body class="bg-festival text-white h-screen flex flex-col justify-start overflow-hidden p-2 pt-1 gap-1">

  <!-- 音源要素 -->
  <audio id="bgmAudio" preload="auto"></audio>

  <!-- ヘッダー -->
  <header class="w-full h-[36px] shrink-0 flex justify-between items-center border-b border-red-900/40 z-10 px-1">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-full bg-red-700 flex items-center justify-center border border-amber-400 shadow-md shrink-0">
        <i class="fa-solid font-bold text-amber-300 text-[10px]">祭</i>
      </div>
      <div>
        <h1 class="text-xs font-bold text-amber-400 font-japanese leading-none">太鼓練習アプリ</h1>
        <p id="currentSongTitle" class="text-[8px] text-red-300 truncate max-w-[120px]">楽曲未選択</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <!-- 一時停止 / 再開ボタン -->
      <button id="pauseBtn" class="hidden bg-amber-800 active:bg-amber-900 border border-amber-400 text-amber-200 text-[10px] px-2 py-0.5 rounded-lg font-bold shadow-md flex items-center gap-1">
        <i id="pauseIcon" class="fa-solid fa-pause"></i>
        <span id="pauseText">一時停止</span>
      </button>

      <button id="resetBtn" class="hidden bg-stone-800 active:bg-stone-900 border border-amber-500/50 text-amber-300 text-[10px] px-2 py-0.5 rounded-lg font-bold shadow-md">
        <i class="fa-solid fa-rotate-left mr-0.5"></i>曲選択へ
      </button>

      <div class="flex items-center bg-red-950/80 border border-amber-500/40 rounded-full p-0.5">
        <label class="flex items-center cursor-pointer gap-1 px-1 text-[10px] font-bold text-amber-200">
          <span class="text-amber-400 font-japanese"><i class="fa-solid fa-eye-slash mr-0.5"></i>暗譜</span>
          <input type="checkbox" id="blindToggle" class="sr-only peer">
          <div class="w-6 h-3 bg-stone-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-amber-300 after:border-amber-400 after:border after:rounded-full after:h-2 after:w-2 after:transition-all peer-checked:bg-red-600 relative"></div>
        </label>
      </div>
    </div>
  </header>

  <!-- 描画エリア（レーン表示） -->
  <main class="relative shrink-0 w-full flex items-start justify-center min-h-0 overflow-hidden">
    <div id="gameContainer" class="relative w-full max-h-[75vh] aspect-[16/9] bg-black rounded-xl border-2 border-amber-700/60 shadow-xl overflow-hidden flex flex-col justify-center items-center">

      <canvas id="gameCanvas" width="1280" height="720" class="w-full h-full block z-10 object-contain"></canvas>

      <div id="blindBadge" class="hidden absolute top-6 left-1/2 transform -translate-x-1/2 bg-red-900/90 border border-amber-400 text-amber-300 text-[9px] px-2 py-0.5 rounded-full animate-pulse shadow-lg font-bold z-20">
        <i class="fa-solid fa-ghost mr-1"></i>暗譜中（ノーツ非表示）
      </div>

      <!-- 一時停止中表示オーバーレイ -->
      <div id="pauseOverlay" class="hidden absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-25 pointer-events-none">
        <span class="text-2xl font-bold font-japanese text-amber-300 border-2 border-amber-400 px-4 py-1 rounded-xl bg-black/70 shadow-2xl">
          <i class="fa-solid fa-pause mr-2"></i>一時停止中
        </span>
      </div>

      <div id="judgementPopup" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-150 text-center z-20">
        <span id="judgementText" class="text-2xl font-extrabold tracking-widest font-japanese drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)]">PERFECT</span>
      </div>

      <!-- スタート / 楽曲選択画面 -->
      <div id="overlay" class="absolute inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-3 text-center z-30 transition-all overflow-y-auto">
        <h2 id="overlayTitle" class="text-base font-bold font-japanese text-amber-400 mb-2">和太鼓 演舞演習</h2>
        
        <div id="resultBox" class="hidden mb-3 p-2 bg-stone-900/90 border border-amber-500 rounded-lg text-amber-200 text-xs w-full max-w-xs">
          <div class="text-sm font-bold text-amber-400 mb-1">演奏結果</div>
          <div id="finalScoreText" class="text-base font-extrabold text-amber-300">SCORE: 0 / 0</div>
          <div id="maxComboText" class="text-xs font-bold text-amber-200 mt-0.5">MAX COMBO: 0 / 0</div>
        </div>

        <!-- 楽曲リスト設定エリア -->
        <div class="w-full max-w-xs mb-3">
          <label class="block text-[10px] text-amber-200 font-bold mb-1 text-left">曲目一覧</label>
          <select id="songSelect" class="w-full bg-stone-800 border border-amber-500 text-amber-100 text-xs p-1.5 rounded-lg focus:outline-none">
            <option value="">楽曲リストを読み込み中...</option>
          </select>
        </div>

        <!-- 練習速度選択 -->
        <div class="mb-3 w-full max-w-xs">
          <label class="block text-[10px] text-amber-200 mb-1 font-bold">練習速度</label>
          <div class="flex justify-center gap-2">
            <button class="speed-btn px-2 py-0.5 rounded bg-stone-800 border border-stone-600 text-[10px] font-bold" data-speed="0.8">0.8x</button>
            <button class="speed-btn px-2 py-0.5 rounded bg-amber-600 border border-amber-400 text-[10px] font-bold" data-speed="1.0">1.0x</button>
            <button class="speed-btn px-2 py-0.5 rounded bg-stone-800 border border-stone-600 text-[10px] font-bold" data-speed="1.2">1.2x</button>
          </div>
        </div>

        <button id="startBtn" disabled class="w-full max-w-xs py-2 bg-gradient-to-r from-red-700 to-amber-600 text-amber-100 font-bold font-japanese text-xs rounded-xl shadow-lg border border-amber-300 disabled:opacity-50 transition-transform active:scale-95">
          演舞開始
        </button>
      </div>

    </div>
  </main>

  <!-- 操作ボタンエリア（太鼓＋上部シークバー＋スコア表示バー） -->
  <footer class="relative w-full flex-1 h-[48vh] min-h-0 rounded-2xl border-2 border-amber-700/60 overflow-hidden shadow-2xl bg-black flex flex-col">
    
    <!-- 太鼓の上のタイムシークバー（横グラフ表示） -->
    <div class="w-full h-2 bg-stone-900/90 border-b border-amber-700/50 relative shrink-0">
      <div id="seekBarFill" class="h-full bg-amber-500 w-0 transition-all duration-75"></div>
    </div>

    <!-- スコア表示バー（太鼓エリア最上部前面） -->
    <div class="w-full bg-black/80 border-b border-amber-900/40 py-1 px-3 flex justify-between text-[11px] text-amber-200 font-bold z-20 shrink-0">
      <span id="speedDisplay">速度: 1.0x</span>
      <span id="comboDisplay" class="text-amber-400 font-extrabold">0 COMBO</span>
      <span id="scoreDisplay">SCORE: 0 / 0</span>
    </div>

    <div class="relative flex-1 w-full h-full">
      <img src="taiko.jpg" alt="太鼓" class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none z-0">

      <div class="relative z-10 w-full h-full grid grid-cols-2 gap-2 p-1">
        <button id="btnLeft" class="drum-pad h-full bg-transparent border border-amber-600/30 rounded-xl touch-none select-none transition-all outline-none">
        </button>

        <button id="btnRight" class="drum-pad h-full bg-transparent border border-amber-600/30 rounded-xl touch-none select-none transition-all outline-none">
        </button>
      </div>
    </div>
  </footer>

  <script>
    const CANVAS_WIDTH = 1280;
    const CANVAS_HEIGHT = 720;
    const HIT_X = 220; 
    const SPEED_SEC = 1.0; 
    const Y_TOP = 190;    // 右手（上段）ノーツ中心Y座標
    const Y_BOTTOM = 470; // 左手（下段）ノーツ中心Y座標
    const NOTE_RADIUS = 46;
    const LANE_HEIGHT = 100;       // 黒色の流れるレーン高さ
    const TEXT_BELT_HEIGHT = 60;  // 下部白帯の高さ

    let songs = {}; 
    let currentSongKey = null;
    let isPlaying = false;
    let isPaused = false;
    let speedMultiplier = 1.0;
    let isBlindMode = false;
    let score = 0;
    let maxScore = 0;
    let combo = 0;
    let maxCombo = 0;
    let totalNotesCount = 0;
    let notes = [];
    let particles = [];
    let animationFrameId = null;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgmAudio = document.getElementById('bgmAudio');
    const songSelect = document.getElementById('songSelect');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseText = document.getElementById('pauseText');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const seekBarFill = document.getElementById('seekBarFill');

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSongList();
    });

    async function loadSongList() {
      try {
        const res = await fetch('songs.json');
        if (res.ok) {
          const folderList = await res.json();
          for (const folder of folderList) {
            await fetchSongData(folder);
          }
        } else {
          const defaultFolders = ['曲名①', '曲名②'];
          for (const folder of defaultFolders) {
            await fetchSongData(folder);
          }
        }
      } catch (e) {
        console.warn('songs.json の読み込みに失敗したため、デフォルトフォルダを探します', e);
        const defaultFolders = ['曲名①', '曲名②'];
        for (const folder of defaultFolders) {
          await fetchSongData(folder);
        }
      }

      updateSongDropdown();
    }

    async function fetchSongData(folder) {
      try {
        const txtUrl = `${encodeURIComponent(folder)}/note_time.txt`;
        const res = await fetch(txtUrl);
        if (res.ok) {
          const text = await res.text();
          songs[folder] = {
            bgmUrl: `${encodeURIComponent(folder)}/bgm.mp3`,
            parsedNotes: parseNoteTimeText(text)
          };
        }
      } catch (e) {
        console.error(`${folder} の読み込みエラー:`, e);
      }
    }

    function updateSongDropdown() {
      songSelect.innerHTML = '';
      const songKeys = Object.keys(songs);

      if (songKeys.length === 0) {
        songSelect.innerHTML = '<option value="">楽曲データが見つかりません</option>';
        startBtn.disabled = true;
        return;
      }

      songKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = key;
        songSelect.appendChild(opt);
      });

      currentSongKey = songKeys[0];
      songSelect.value = currentSongKey;
      startBtn.disabled = false;
      document.getElementById('currentSongTitle').innerText = currentSongKey;
    }

    songSelect.addEventListener('change', (e) => {
      currentSongKey = e.target.value;
      startBtn.disabled = !currentSongKey;
      document.getElementById('currentSongTitle').innerText = currentSongKey || '楽曲未選択';
    });

    function parseNoteTimeText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const right = [];
      const left = [];

      let prevTime = -1.0;
      let isLeft = false;

      lines.forEach((line) => {
        const parts = line.split('\t');
        if (parts.length === 0) return;

        const startTime = parseFloat(parts[0]);
        if (isNaN(startTime)) return;

        const noteType = (parts.length >= 3 && parts[2].trim() === '0') ? 'ton' : 'don';

        if (startTime < prevTime) {
          isLeft = true;
        }
        prevTime = startTime;

        const noteObj = { time: startTime, type: noteType };
        if (!isLeft) {
          right.push(noteObj);
        } else {
          left.push(noteObj);
        }
      });

      return { right, left };
    }

    function initGame() {
      if (!currentSongKey || !songs[currentSongKey]) return;

      const song = songs[currentSongKey];
      bgmAudio.src = song.bgmUrl;

      score = 0;
      combo = 0;
      maxCombo = 0;
      particles = [];
      isPaused = false;
      updatePauseButtonUI();

      notes = [];
      song.parsedNotes.right.forEach(n => {
        notes.push({ hitTime: n.time, yPos: Y_TOP, type: n.type, hit: false, missed: false });
      });
      song.parsedNotes.left.forEach(n => {
        notes.push({ hitTime: n.time, yPos: Y_BOTTOM, type: n.type, hit: false, missed: false });
      });

      // ノーツ総数と満点の計算
      totalNotesCount = notes.length;
      maxScore = totalNotesCount * 1000;
      updateUI();

      isPlaying = true;
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
      resetBtn.classList.remove('hidden');
      pauseBtn.classList.remove('hidden');

      bgmAudio.currentTime = 0;
      bgmAudio.playbackRate = speedMultiplier;
      bgmAudio.play().catch(e => console.warn("音声再生エラー:", e));

      cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function togglePause() {
      if (!isPlaying) return;

      isPaused = !isPaused;
      if (isPaused) {
        bgmAudio.pause();
        pauseOverlay.classList.remove('hidden');
      } else {
        bgmAudio.play().catch(e => console.warn("再開エラー:", e));
        pauseOverlay.classList.add('hidden');
        gameLoop();
      }
      updatePauseButtonUI();
    }

    function updatePauseButtonUI() {
      if (isPaused) {
        pauseIcon.className = 'fa-solid fa-play';
        pauseText.innerText = '再開';
        pauseBtn.classList.remove('bg-amber-800', 'active:bg-amber-900');
        pauseBtn.classList.add('bg-emerald-700', 'active:bg-emerald-800');
      } else {
        pauseIcon.className = 'fa-solid fa-pause';
        pauseText.innerText = '一時停止';
        pauseBtn.classList.remove('bg-emerald-700', 'active:bg-emerald-800');
        pauseBtn.classList.add('bg-amber-800', 'active:bg-amber-900');
      }
    }

    function gameLoop() {
      if (!isPlaying || isPaused) return;

      const currentTime = bgmAudio.currentTime;
      const duration = bgmAudio.duration || 1;

      // シークバー（横グラフが左から塗りつぶされる表現）
      const progressRatio = Math.min(Math.max(currentTime / duration, 0), 1);
      seekBarFill.style.width = (progressRatio * 100).toFixed(2) + '%';

      // 描画設定のリセット
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1.0;

      // キャンバス全体クリア
      ctx.fillStyle = '#1e0505';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 上下レーンのバックグラウンド描画
      [ {y: Y_TOP, label: '右手'}, {y: Y_BOTTOM, label: '左手'} ].forEach(lane => {
        const y = lane.y;
        const laneTop = y - NOTE_RADIUS - 4;
        
        ctx.fillStyle = '#3a1e14';
        ctx.fillRect(0, laneTop, CANVAS_WIDTH, LANE_HEIGHT);

        const beltTop = laneTop + LANE_HEIGHT;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, beltTop, CANVAS_WIDTH, TEXT_BELT_HEIGHT);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, laneTop, CANVAS_WIDTH, LANE_HEIGHT + TEXT_BELT_HEIGHT);
        ctx.beginPath();
        ctx.moveTo(0, beltTop);
        ctx.lineTo(CANVAS_WIDTH, beltTop);
        ctx.stroke();

        // レーン左側の「右手」「左手」文字描画
        ctx.fillStyle = '#f59e0b';
        ctx.font = '900 36px "Zen Maru Gothic", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(lane.label, 40, y);

        // 判定枠（丸印）
        ctx.beginPath();
        ctx.arc(HIT_X, y, NOTE_RADIUS + 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(60, 60, 60, 0.7)';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(HIT_X, y, NOTE_RADIUS - 4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // ノーツ描画
      notes.forEach((note) => {
        const timeDiff = note.hitTime - currentTime;

        if (timeDiff < -0.12 && !note.hit && !note.missed) {
          note.missed = true;
          handleJudgement('MISS');
        }

        if (note.hit) return;

        const x = HIT_X + (timeDiff / SPEED_SEC) * (CANVAS_WIDTH - HIT_X);

        if (x > -NOTE_RADIUS * 2 && x < CANVAS_WIDTH + NOTE_RADIUS * 2) {
          if (!isBlindMode) {
            drawFaceNote(x, note.yPos, NOTE_RADIUS, note.type);
          }
        }
      });

      drawParticles();

      if (bgmAudio.ended || (bgmAudio.duration && currentTime >= bgmAudio.duration)) {
        endGame();
        return;
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function drawFaceNote(x, y, r, type) {
      ctx.save();

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, r - 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, r - 7, 0, Math.PI * 2);
      ctx.fillStyle = (type === 'don') ? '#ff3322' : '#22b5ff';
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';

      const eyeOffsetY = -5;
      const eyeOffsetX = 13;
      ctx.beginPath();
      ctx.arc(x - eyeOffsetX, y + eyeOffsetY, 4.5, 0, Math.PI * 2);
      ctx.arc(x + eyeOffsetX, y + eyeOffsetY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y + 5, 11, 0.1 * Math.PI, 0.9 * Math.PI, false);
      ctx.stroke();

      const beltTop = y + r + 4;
      const textY = beltTop + (TEXT_BELT_HEIGHT / 2);

      ctx.fillStyle = '#111111';
      ctx.font = '900 48px "Zen Maru Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const labelText = (type === 'don') ? '大' : '小';
      ctx.fillText(labelText, x, textY);

      ctx.restore();
    }

    function spawnFireworkEffect(x, y) {
      const colors = ['#fbbf24', '#f59e0b', '#ef4444', '#ffffff'];
      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 10 + 3;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1.0,
          decay: 0.03
        });
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function triggerHit(isRight = true) {
      if (!isPlaying || isPaused) return;

      const targetY = isRight ? Y_TOP : Y_BOTTOM;
      spawnFireworkEffect(HIT_X, targetY);

      const currentTime = bgmAudio.currentTime;
      let closestNote = null;
      let minDiff = Infinity;

      const checkY = isRight ? Y_TOP : Y_BOTTOM;
      notes.forEach((note) => {
        if (note.yPos === checkY && !note.hit && !note.missed) {
          const diff = Math.abs(note.hitTime - currentTime);
          if (diff < minDiff) {
            minDiff = diff;
            closestNote = note;
          }
        }
      });

      if (closestNote && minDiff <= 0.12) {
        closestNote.hit = true;
        if (minDiff <= 0.03) handleJudgement('PERFECT', 1000);
        else if (minDiff <= 0.07) handleJudgement('GREAT', 700);
        else handleJudgement('GOOD', 400);
      }
    }

    function handleJudgement(type, points = 0) {
      const popup = document.getElementById('judgementPopup');
      const text = document.getElementById('judgementText');
      popup.classList.remove('opacity-0');

      if (type === 'PERFECT') {
        text.innerText = '天晴 (PERFECT!)';
        text.className = 'text-2xl font-extrabold font-japanese text-amber-300 drop-shadow-[0_0_12px_rgba(245,158,11,0.9)]';
        score += points; combo++;
      } else if (type === 'GREAT') {
        text.innerText = '見事 (GREAT)';
        text.className = 'text-2xl font-extrabold font-japanese text-red-400';
        score += points; combo++;
      } else if (type === 'GOOD') {
        text.innerText = '良 (GOOD)';
        text.className = 'text-xl font-bold font-japanese text-blue-400';
        score += points; combo++;
      } else {
        text.innerText = '不可 (MISS)';
        text.className = 'text-xl font-bold font-japanese text-stone-500';
        combo = 0;
      }

      if (combo > maxCombo) maxCombo = combo;
      updateUI();

      clearTimeout(popup.timer);
      popup.timer = setTimeout(() => popup.classList.add('opacity-0'), 350);
    }

    function updateUI() {
      document.getElementById('scoreDisplay').innerText = `SCORE: ${score} / ${maxScore}`;
      document.getElementById('comboDisplay').innerText = `${combo} COMBO`;
    }

    function resetToTitle() {
      isPlaying = false;
      isPaused = false;
      cancelAnimationFrame(animationFrameId);
      bgmAudio.pause();
      bgmAudio.currentTime = 0;

      seekBarFill.style.width = '0%';

      resetBtn.classList.add('hidden');
      pauseBtn.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('overlayTitle').innerText = '和太鼓 演舞演習';
      document.getElementById('startBtn').innerText = '演舞開始';
      document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none');
    }

    function endGame() {
      isPlaying = false;
      isPaused = false;
      cancelAnimationFrame(animationFrameId);
      bgmAudio.pause();
      resetBtn.classList.add('hidden');
      pauseBtn.classList.add('hidden');
      pauseOverlay.classList.add('hidden');

      const overlay = document.getElementById('overlay');
      document.getElementById('overlayTitle').innerText = '演舞 終了！';
      
      // 演奏結果の表示（スコア / 満点、MAX COMBO / 総ノーツ数）
      document.getElementById('finalScoreText').innerText = `SCORE: ${score} / ${maxScore}`;
      document.getElementById('maxComboText').innerText = `MAX COMBO: ${maxCombo} / ${totalNotesCount}`;
      document.getElementById('resultBox').classList.remove('hidden');

      document.getElementById('startBtn').innerText = 'もう一度挑戦';
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    resetBtn.addEventListener('click', resetToTitle);
    pauseBtn.addEventListener('click', togglePause);
    startBtn.addEventListener('click', initGame);

    document.getElementById('blindToggle').addEventListener('change', (e) => {
      isBlindMode = e.target.checked;
      document.getElementById('blindBadge').classList.toggle('hidden', !isBlindMode);
    });

    document.querySelectorAll('.speed-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.classList.remove('bg-amber-600', 'border-amber-400');
          b.classList.add('bg-stone-800', 'border-stone-600');
        });
        e.target.classList.remove('bg-stone-800', 'border-stone-600');
        e.target.classList.add('bg-amber-600', 'border-amber-400');
        speedMultiplier = parseFloat(e.target.dataset.speed);
        document.getElementById('speedDisplay').innerText = `速度: ${speedMultiplier}x`;
      });
    });

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHit(false); }, {passive: false});
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHit(true); }, {passive: false});
    btnLeft.addEventListener('mousedown', () => triggerHit(false));
    btnRight.addEventListener('mousedown', () => triggerHit(true));

    function pauseBgmOnLeave() {
      if (isPlaying && !isPaused) {
        togglePause();
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        pauseBgmOnLeave();
      }
    });

    window.addEventListener('pagehide', pauseBgmOnLeave);
    window.addEventListener('unload', pauseBgmOnLeave);
    window.addEventListener('blur', pauseBgmOnLeave);
  </script>
</body>
</html>
