<!-- アプリメインエリア -->
  <main class="relative w-full h-[calc(100vh-42px)] flex flex-col overflow-hidden">

    <!-- スタート画面（画面全面に被さり、開始時にフェードアウト） -->
    <div id="overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-4 text-center transition-opacity duration-1000 ease-in-out bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(13,2,2,0.6), rgba(13,2,2,0.4), rgba(13,2,2,0.8)), url('大島八幡社.jpg');">
      
      <!-- 曲選択 & 速度調整フォーム -->
      <div class="w-full max-w-xs bg-black/80 backdrop-blur-md p-4 rounded-2xl border border-amber-600/50 shadow-2xl space-y-3">
        <!-- 曲選択 -->
        <div class="text-left">
          <label class="block text-xs text-amber-200 font-bold mb-1 flex items-center gap-1.5">
            <i class="fa-solid fa-music text-amber-400"></i>曲選択
          </label>
          <select id="songSelect" class="w-full bg-stone-900 border border-amber-500/70 text-amber-100 text-xs p-2 rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-400 font-bold">
            <option value="">楽曲リストを読み込み中...</option>
          </select>
        </div>

        <!-- 練習速度選択 -->
        <div class="text-left">
          <label class="block text-xs text-amber-200 mb-1 font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-gauge-high text-amber-400"></i>練習速度
          </label>
          <div class="flex justify-center gap-2">
            <button class="speed-btn flex-1 py-1.5 rounded-lg bg-stone-800 border border-stone-600 text-xs font-bold text-stone-300" data-speed="0.8">0.8倍</button>
            <button class="speed-btn flex-1 py-1.5 rounded-lg bg-amber-600 border border-amber-400 text-xs font-bold text-amber-100 shadow-md" data-speed="1.0">1.0倍</button>
            <button class="speed-btn flex-1 py-1.5 rounded-lg bg-stone-800 border border-stone-600 text-xs font-bold text-stone-300" data-speed="1.2">1.2倍</button>
          </div>
        </div>

        <!-- 演舞開始ボタン -->
        <button id="startBtn" class="w-full mt-2 py-3 bg-gradient-to-r from-red-700 via-amber-600 to-red-700 text-amber-100 font-bold font-japanese text-base rounded-xl shadow-2xl border border-amber-300/80 disabled:opacity-50 transition-all hover:brightness-110 active:scale-95 animate-pulse">
          <i class="fa-solid fa-drum mr-1.5"></i>演舞開始
        </button>
      </div>

    </div>

    <!-- 描画エリア（レーン表示） -->
    <div id="gameContainer" class="relative shrink-0 w-full max-h-[45vh] aspect-[16/9] bg-black rounded-b-xl border-b-2 border-amber-700/60 shadow-xl overflow-hidden flex flex-col justify-center items-center">
      <canvas id="gameCanvas" width="1280" height="720" class="w-full h-full block z-10 object-contain"></canvas>

      <div id="blindBadge" class="hidden absolute top-3 left-1/2 transform -translate-x-1/2 bg-red-900/90 border border-amber-400 text-amber-300 text-[9px] px-2 py-0.5 rounded-full animate-pulse shadow-lg font-bold z-20">
        <i class="fa-solid fa-ghost mr-1"></i>暗譜中（ノーツ非表示）
      </div>

      <!-- 一時停止中表示オーバーレイ -->
      <div id="pauseOverlay" class="hidden absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-25 pointer-events-none">
        <span class="text-2xl font-bold font-japanese text-amber-300 border-2 border-amber-400 px-4 py-1 rounded-xl bg-black/70 shadow-2xl">
          <i class="fa-solid fa-pause mr-2"></i>一時停止中
        </span>
      </div>

      <!-- 判定文字表示 -->
      <div id="judgementPopup" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-150 text-center z-20 whitespace-nowrap">
        <span id="judgementText" class="text-xl sm:text-2xl font-extrabold tracking-widest font-japanese drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] whitespace-nowrap">天晴</span>
      </div>
    </div>

    <!-- 太鼓操作エリア -->
    <footer class="relative w-full flex-1 min-h-0 rounded-t-2xl border-t-2 border-amber-700/60 overflow-hidden shadow-2xl bg-black flex flex-col mt-auto">
      <div class="w-full h-2 bg-stone-900/90 border-b border-amber-700/50 relative shrink-0">
        <div id="seekBarFill" class="h-full bg-amber-500 w-0 transition-all duration-75"></div>
      </div>

      <div class="w-full bg-black/80 border-b border-amber-900/40 py-1 px-3 flex justify-between text-[11px] text-amber-200 font-bold z-20 shrink-0">
        <span id="speedDisplay">速度: 1.0x</span>
        <span id="comboDisplay" class="text-amber-400 font-extrabold">0 COMBO</span>
        <span id="scoreDisplay">SCORE: 0 / 0</span>
      </div>

      <div id="resultBox" class="hidden absolute top-7 left-1/2 transform -translate-x-1/2 z-30 p-2.5 bg-stone-900/95 border-2 border-amber-500 rounded-xl text-amber-200 text-xs w-[92%] max-w-sm text-center shadow-2xl backdrop-blur-md">
        <div class="text-xs font-bold text-amber-400 mb-0.5 font-japanese">演舞 判定結果</div>
        <div id="finalScoreText" class="text-xs font-extrabold text-amber-300">SCORE: 0 / 0</div>
        <div id="maxComboText" class="text-[10px] font-bold text-amber-200 mt-0.5">MAX COMBO: 0 / 0</div>

        <div class="mt-2 text-left">
          <div class="flex justify-between text-[9px] text-amber-300/80 mb-0.5 font-bold">
            <span>判定内訳</span>
            <span id="accuracyPercent">精度 100%</span>
          </div>
          <div class="w-full h-3.5 bg-stone-800 rounded-md overflow-hidden flex border border-stone-700 shadow-inner">
            <div id="barPerfect" class="h-full bg-amber-400 transition-all duration-500" style="width: 0%;" title="天晴"></div>
            <div id="barGreat" class="h-full bg-red-500 transition-all duration-500" style="width: 0%;" title="見事"></div>
            <div id="barGood" class="h-full bg-blue-400 transition-all duration-500" style="width: 0%;" title="可"></div>
            <div id="barMiss" class="h-full bg-stone-600 transition-all duration-500" style="width: 0%;" title="不可"></div>
          </div>
          <div class="flex justify-between text-[8px] mt-1 text-stone-300 font-bold px-0.5">
            <span class="text-amber-400">天晴: <span id="countPerfect">0</span></span>
            <span class="text-red-400">見事: <span id="countGreat">0</span></span>
            <span class="text-blue-400">可: <span id="countGood">0</span></span>
            <span class="text-stone-400">不可: <span id="countMiss">0</span></span>
          </div>
        </div>

        <div id="motivationBox" class="hidden mt-2 p-1.5 rounded-lg border text-[9px] leading-tight text-center"></div>
      </div>

      <div class="relative flex-1 w-full h-full">
        <img src="taiko.jpg" alt="太鼓" class="absolute inset-0 w-full h-full object-contain pointer-events-none select-none z-0">

        <div class="relative z-10 w-full h-full grid grid-cols-2 gap-2 p-1">
          <button id="btnLeft" class="drum-pad h-full bg-transparent border border-amber-600/30 rounded-xl touch-none select-none transition-all outline-none flex items-center justify-center">
            <span class="hand-label text-2xl tracking-wider pointer-events-none">左手</span>
          </button>

          <button id="btnRight" class="drum-pad h-full bg-transparent border border-amber-600/30 rounded-xl touch-none select-none transition-all outline-none flex items-center justify-center">
            <span class="hand-label text-2xl tracking-wider pointer-events-none">右手</span>
          </button>
        </div>
      </div>
    </footer>

  </main>
